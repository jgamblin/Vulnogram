<!doctype html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vulnogram — CVE Editor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>"
    />
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body
    class="bg-white text-vg-900 dark:bg-vg-950 dark:text-vg-100 min-h-screen"
  >
    <div id="app" class="flex min-h-screen">
      <!-- Sidebar overlay (mobile) -->
      <div id="sidebar-overlay" class="vg-sidebar-overlay"></div>

      <!-- Sidebar -->
      <aside id="sidebar" class="vg-sidebar">
        <div class="vg-sidebar-brand">
          <span class="vg-sidebar-label">Vulnogram</span>
          <span class="vg-sidebar-collapsed-brand hidden font-semibold">V</span>
        </div>
        <nav class="vg-sidebar-nav">
          <a href="#" class="vg-sidebar-item active" data-section="cve">
            <span data-icon="cve" class="vg-sidebar-icon"></span>
            <span class="vg-sidebar-label">CVE Editor</span>
          </a>
          <a href="#" class="vg-sidebar-item" data-section="calculator">
            <span data-icon="calculator" class="vg-sidebar-icon"></span>
            <span class="vg-sidebar-label">CVSS Calculator</span>
          </a>
        </nav>
        <div class="vg-sidebar-footer">
          <button
            id="sidebar-toggle"
            class="vg-sidebar-item w-full"
            aria-label="Toggle sidebar"
          >
            <span
              data-icon="chevronLeft"
              data-collapsed-icon="chevronRight"
              class="vg-sidebar-icon"
            ></span>
            <span class="vg-sidebar-label">Collapse</span>
          </button>
        </div>
      </aside>

      <!-- Main content -->
      <main class="flex-1 flex flex-col min-w-0">
        <!-- Top bar -->
        <header class="vg-topbar">
          <button
            id="mobile-menu-btn"
            class="vg-btn-ghost p-2 md:hidden"
            aria-label="Open menu"
          >
            <span data-icon="bars3"></span>
          </button>
          <button id="search-trigger" class="vg-topbar-search">
            <span data-icon="search"></span>
            <span>Search...</span>
            <kbd class="ml-2 text-xs text-vg-300 dark:text-vg-600">⌘K</kbd>
          </button>
          <div class="flex-1"></div>
          <button
            id="theme-toggle"
            class="vg-btn-ghost p-2"
            aria-label="Toggle dark mode"
          >
            <span data-icon="moon" class="dark:hidden"></span>
            <span data-icon="sun" class="hidden dark:block"></span>
          </button>
        </header>

        <!-- Content area -->
        <div id="content" class="flex-1 p-6 max-w-4xl mx-auto w-full">
          <h1 class="text-2xl font-semibold mb-2">CVE Editor</h1>
          <p class="text-vg-500 dark:text-vg-400 mb-8">
            Create and edit CVE records
          </p>

          <!-- Placeholder for form engine -->
          <div class="vg-card">
            <p class="text-sm text-vg-500">Form engine will render here.</p>
          </div>
        </div>
      </main>
    </div>

    <!-- Command palette modal shell -->
    <div id="command-palette" class="fixed inset-0 z-50 hidden">
      <div
        class="fixed inset-0 bg-black/50 dark:bg-black/70"
        id="command-palette-backdrop"
      ></div>
      <div class="fixed inset-x-4 top-[20%] mx-auto max-w-lg">
        <div class="vg-card shadow-2xl">
          <input
            id="command-palette-input"
            type="text"
            class="vg-input"
            placeholder="Type a command..."
            autocomplete="off"
          />
          <div id="command-palette-results" class="mt-2"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
